<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Moodboard</h1>
  <p class="sub">How are you feeling right now?</p>

  <div class="moods" id="moods"></div>

  <div class="breath"><div class="circle" id="circle">Breathe in</div></div>

  <blockquote id="quote"></blockquote>
  <div class="actions">
    <button id="newBtn">New quote</button>
    <button id="saveBtn" class="ghost">Save quote</button>
    <button id="copyBtn" class="ghost">Copy quote</button>
  </div>

  <h2>Music for this mood</h2>
  <ul id="playlists"></ul>

  <h2>Saved quotes</h2>
  <ul id="saved" class="saved"></ul>
</main>

<script src="script.js"></script>
</body>
</html>
